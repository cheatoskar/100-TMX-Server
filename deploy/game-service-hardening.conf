# systemd drop-in for the game server service(s). Install with:
#   sudo mkdir -p /etc/systemd/system/100tmx.service.d
#   sudo cp game-service-hardening.conf /etc/systemd/system/100tmx.service.d/hardening.conf
#   sudo systemctl daemon-reload
# No restart needed - it applies from the next start of the service.
[Service]
# Exit code 78 means the configuration is broken (config.toml doesn't parse, a preset is
# invalid). Restarting every 5 seconds can't fix that - stop, and let the journal say why.
RestartPreventExitStatus=78
# No core dumps: every crash used to write one (CPU and disk on a 1 GB machine) and the useful
# information is in the journal anyway.
LimitCORE=0
