DisplayName = "100% TMX Project (TMNF + Unlimiter)"
Description = "Every TMX map without a record yet, Unlimiter maps included (you need TMUnlimiter for those)."
Games = ["TMNF"]

TmxGame = "TMNF"
AutoSkipMode = "Finished"

[TmxQuery]
inhasrecord = 0
# no inunlimiter filter: Unlimiter maps are part of this pool on purpose
# no "routes" filter here on purpose: multilap is back in the pool now that /rounds lets players
# switch a specific multilap map to Rounds mode for a valid replay (previously excluded because
# TimeAttack replays on multilap tracks aren't accepted by TMX). Listing all 4 possible "routes"
# values instead of omitting the filter (i.e. "routes=0,1,2,3") returns a 500 from TMX - verified
# live, looks like a bug on their end when the filter covers every value