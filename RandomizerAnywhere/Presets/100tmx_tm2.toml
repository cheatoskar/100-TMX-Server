DisplayName = "100% TMX Project (TM2)"
Description = "Random tm.mania.exchange maps without a replay yet - finish them to get TMX to 100 %."
Games = ["TM2"]

TmxGame = "TM2"
AutoSkipMode = "Finished"

[TmxQuery]
# tm.mania.exchange: "inhasreplay" is the record filter there. The title the server runs
