Game = "TMNF"
TmxGame = "TMNF"

# TM2 and TM2020: Game = "TM2" or "TM2020" (TmxGame the same), Preset "100tmx_tm2" / "100tmx_tm2020".
# TM2 only: the title the server runs - "TMStadium@nadeo" (default), "TMCanyon@nadeo",
# "TMValley@nadeo" or "TMLagoon@nadeo". Players need the same title; the title pack is downloaded
# from maniaplanet.com on the first start. One server per title.
# TitlePack = "TMStadium@nadeo"
BindIP = ""
XmlRpcPort = 5000
AutoSkipMode = "AuthorMedal"
TimeLimit = 0

Preset = "100tmx_tmnf"

ServerName = "100% TMX Project"
ServerComment = "100% TMX RMC - random maps, first to finish wins. Type /info or /source in chat."
GameSettings = "MatchSettings/Randomizer.txt"

# Start the RMC session automatically on server boot, no player needs to type /start
AutoStart = true

# Comma-separated TMF logins allowed to use /stop, /end, /start and /preset (direct, no vote needed).
# /presets (listing) and /votepreset (player vote) are open to everyone regardless of this setting.
AdminLogins = ""

# Port for the built-in HTTP server that hands players a download link to their own
# server-validated replay (the only kind TMX accepts). Open this TCP port in your firewall.
ReplayServerPort = 8090

# Hostname/IP players can reach this machine on, used to build the replay download link.
# Leave empty for local testing (falls back to localhost) - MUST be set to your public
# IP/domain once this runs on Hetzner, otherwise players get an unreachable link.
PublicHost = ""

# The dedicated server's total upload budget in kbit/s (written into dedicated_cfg.txt). Every
# joining player downloads the random map through this; TMF's own default is 512 (~64 KB/s for
# everyone together). 0 = leave dedicated_cfg.txt as it is.
ConnectionUploadRate = 10240

# LAN-only mode (local network discovery, no masterserver registration). true for local
# testing, MUST be false for a real internet-facing Hetzner deployment.
Lan = false

# Discord webhook URL(s) for /imp and /hard reports. DiscordWebhookUrlHard is optional -
# leave it empty to send both /imp and /hard to the same DiscordWebhookUrl channel.
DiscordWebhookUrl = ""
DiscordWebhookUrlHard = ""

# Event module (off unless EventEnabled = true). A hand-made map list (EventMapsFile, re-read
# within seconds while the server runs) shown as a list on the left; a finished map is marked
# done with who, time and when. With the "event" preset the server plays only the open maps.
# Several servers on one machine run one event together: point their EventMapsFile and
# EventStateFile at the same files - they share progress, never play the same map at once and
# list each other's current map. Empty paths = event-maps.json / event-state.json next to the
# program. EventServerLabel = this server's short name in that list (empty = ServerName).
# EventUnlimiter = true: this server plays the list's Unlimiter maps ({"id": 123, "unlimiter": true}).
EventEnabled = false
EventMapsFile = ""
EventStateFile = ""
EventServerLabel = ""
EventUnlimiter = false
# EventMapsSource = "tmx": the list is every map [EventTmxQuery] finds on TMX (default: no record
# yet, no Unlimiter), minus the impossible and skip lists, refreshed every EventTmxRefreshMinutes -
# new uploads join, maps that got a record elsewhere leave. "file" (default) = EventMapsFile.
EventMapsSource = "file"
EventTitle = ""
EventTmxRefreshMinutes = 5
# Once every map on the list is finished, every server shows the results (winner = most maps
# finished first) and switches to this preset, e.g. "100tmx_tmnf". Empty = stay on the event.
EventAfterPreset = ""
# Which of the list's maps this server plays: "skip" the Unlimiter maps, "only" those, or
# "include" both. Empty = "only" with EventUnlimiter = true, else "skip". With EventMapsSource =
# "tmx" the Unlimiter maps are found on TMX (leave inunlimiter out of [EventTmxQuery] to list them).
EventUnlimiterMaps = ""
# The list as an everyday "open maps" panel instead of an event: it never ends, every server keeps
# its own preset and pool (but never draws a map another server of the list is playing), a click
# on a map starts a vote, and a map finished but still without a TMX record a day later (nobody
# uploaded the replay) is open again. Use a fresh EventStateFile for it, not an old event's.
EventEveryday = false

# Servers on different machines share one leaderboard and the list through one of them, the hub,
# over its status page port (/sync/). On the hub: SyncToken (24+ random characters) and
# SyncAllowedIps (the other servers' addresses; empty = any address with the token). On every
# other server: SyncHubUrl (e.g. "http://game.100tmx.com:8090") and the same SyncToken - its own
# leaderboard.json then moves to the hub once (renamed *.moved-to-hub), and finishes the hub
# doesn't take right away wait in leaderboard-pending.json.
SyncHubUrl = ""
SyncToken = ""
SyncAllowedIps = ""

WelcomeMessage = '''
Built on $FF0Randomizer Anywhere$FF0 (modified) - type $FF0/source$FF0 for the code.
$FF0Welcome to $s$0BF100% TMX $FF8Project$FF0!
Type $FF0/info$FF0 to see what this server can do.
'''

[DownloadUrls]
TMF = "http://files2.trackmaniaforever.com/TrackmaniaServer_2011-02-21.zip"
TM = "http://slig.free.fr/TM/dedicated/TmDedicatedServer_2006-05-30.zip"
ManiaPlanet = "http://files.v04.maniaplanet.com/server/ManiaplanetServer_Latest.zip"
Trackmania = "http://files.v04.maniaplanet.com/server/TrackmaniaServer_Latest.zip"

[TmxQuery]
primarytype = 0
inunlimiter = 0
routes = "0,2,3"